services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node-api
      - java-api
      - python-api
    restart: unless-stopped

  node-api:
    build: ../mp-backend-node-service
    environment:
      - PORT=3000
    env_file: .env
    expose:
      - "3000"
    restart: unless-stopped

  java-api:
    build: ../mp-backend-java-service
    environment:
      - PORT=5001
    env_file: .env
    expose:
      - "5001"
    restart: unless-stopped

  python-api:
    build: ../mp-backend-python-service
    env_file: .env
    expose:
      - "8000"
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    expose:
      - "8001"
    restart: unless-stopped

volumes:
  chroma_data:
  caddy_data:
  caddy_config:
